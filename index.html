  body {
    min-height: 100vh;
    display: flex; justify-content: center; align-items: flex-start;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  .cab {
    --w: min(92vw, 520px, calc((100svh - 12px) * 0.472));
    width: var(--w);
    font-size: calc(var(--w) / 52);
    position: relative;
    margin: 6px 0;
    padding: 2.5em 3.4em 0;
    display: flex; flex-direction: column; align-items: center;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(110,170,110,.16), transparent 60%),
      linear-gradient(180deg, #24512a 0%, #163317 45%, #0f2410 100%);
    border-radius: 4em 4em 0 0 / 5em 5em 0 0;
    box-shadow: 0 0 4em rgba(10,25,10,.55);
    overflow: hidden;
  }
  .cab::before, .cab::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 1.9em;
    background: linear-gradient(90deg, #6f625d, #bba9a2 45%, #7a6c66); opacity: .9;
  }
  .cab::before { left: 0; }
  .cab::after { right: 0; transform: scaleX(-1); }

  .head { width: 100%; height: 13em; display: flex; align-items: center; justify-content: space-between; }
  .speaker {
    width: 11em; height: 11em; border-radius: 50%;
    background:
      radial-gradient(circle at center, rgba(0,0,0,.55) .16em, transparent .2em) 0 0 / .85em .85em,
      radial-gradient(circle at 50% 40%, #3d6e41, #1f3d22 70%);
    box-shadow: inset 0 0 0 .5em #11270f, inset 0 .4em 1.2em rgba(0,0,0,.5), 0 .2em .5em rgba(255,255,255,.07);
  }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 1.1em; }
  .mlogo { width: 19em; height: auto; display: block; }
  .brand p { margin: 0; font-size: .9em; font-weight: 600; letter-spacing: .02em; color: rgba(255,252,248,.75); }

  .bezel {
    width: 100%; padding: .9em; border-radius: 3.6em / 3em;
    background: #0e2110;
    box-shadow: inset 0 0 1.2em rgba(0,0,0,.8), 0 0 0 .25em #2c4a2d;
  }
  .screen {
    position: relative; width: 100%; aspect-ratio: 3 / 4;
    border-radius: 3em / 2.6em; overflow: hidden; background: var(--cream);
    box-shadow: 0 0 0 .3em #6fb877, 0 0 2em .3em rgba(111,184,119,.45), inset 0 0 2em rgba(22,51,23,.25);
  }
  #cv { display: block; width: 100%; height: 100%; touch-action: manipulation; cursor: pointer; }
  .scan {
    position: absolute; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(180deg, rgba(22,51,23,.06) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at 50% 50%, transparent 60%, rgba(22,51,23,.2) 100%);
  }

  .panel {
    width: calc(100% + 6.8em); margin: 1.6em -3.4em 0; height: 25em; padding: 0 5em;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(180deg, #0c1a0c, #112611 40%, #0a150a);
    border-top: .35em solid #07100a; position: relative;
  }


  /* arcade details */
  .marquee { width: 100%; display: flex; justify-content: space-between; padding: 0 1.4em; margin: -1.4em 0 1.3em; }
  .marquee i {
    width: 1.1em; height: 1.1em; border-radius: 50%; background: #2d4d30;
    animation: chase var(--bulb, 1.2s) steps(1) infinite;
    animation-delay: calc(var(--bulb, 1.2s) * var(--k) * -0.3333);
  }
  @keyframes chase {
    0% { background: #ffd86b; box-shadow: 0 0 .9em .2em rgba(255,216,107,.8); }
    33.3%, 100% { background: #2d4d30; box-shadow: none; }
  }
  .speaker { transition: transform .09s ease-out; }
  .speaker.thump { transform: scale(1.06); }
  #cv { animation: poweron .8s ease-out; }
  @keyframes poweron {
    0% { transform: scale(.55, .015); filter: brightness(4); }
    55% { transform: scale(1, 1); filter: brightness(2.2); }
    100% { transform: none; filter: none; }
  }
  .scan { animation: flick 5s linear infinite; }
  .scan::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 14%;
    background: linear-gradient(180deg, transparent, rgba(255,255,255,.13), transparent);
    animation: roll 6s linear infinite;
  }
  @keyframes roll { from { transform: translateY(-120%); } to { transform: translateY(700%); } }
  @keyframes flick { 0%, 89%, 100% { opacity: 1; } 90% { opacity: .84; } 92% { opacity: 1; } 95% { opacity: .92; } }
  .screen.flash #cv { animation: flashy .5s ease-out; }
  @keyframes flashy { 0% { filter: brightness(1.8) saturate(1.4); } 100% { filter: none; } }
  .start.idle { animation: pulse 1.3s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 .45em 0 #7c1442, 0 .8em 1.2em rgba(0,0,0,.5); }
    50% { box-shadow: 0 .45em 0 #7c1442, 0 0 2.2em .5em rgba(217,58,133,.75); }
  }
  .led {
    font: 2.4em Anton, Impact, sans-serif; letter-spacing: .12em; color: #ffb347; text-align: center;
    background: #060c06; padding: .22em .8em; border-radius: .35em; min-width: 6.2em;
    box-shadow: inset 0 0 .5em #000, 0 0 0 .08em #2b3a2b;
    text-shadow: 0 0 .4em rgba(255,179,71,.85);
  }
  .led.blink { animation: ledblink 1.1s steps(1) infinite; }
  @keyframes ledblink { 0%, 60% { opacity: 1; } 61%, 100% { opacity: .12; } }
  @media (prefers-reduced-motion: reduce) {
    .marquee i, .scan, .scan::after, #cv, .start.idle, .led.blink, .screen.flash #cv { animation: none !important; }
    .speaker { transition: none; }
  }
  /* world ranking overlays */
  .ov {
    position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column;
    padding: 3em 3em 2.4em; background: rgba(22,51,23,.97); color: var(--cream); overflow: hidden;
  }
  .ov[hidden] { display: none; }
  .ov h2 { margin: 0 0 .3em; font: 5.4em/1 Anton, Impact, sans-serif; letter-spacing: .01em; }
  .ov .sub { margin: 0 0 1.6em; font-size: 1.8em; line-height: 1.3; }
  .ov label { display: block; margin: 0 0 .4em; font-size: 1.6em; font-weight: 700; }
  .ov input, .ov select {
    width: 100%; margin: 0 0 1.2em; border: .12em solid var(--cream); border-radius: .35em; background: #0e2110; color: var(--cream);
  }
  .ov input { font: 3.2em/1.1 Anton, Impact, sans-serif; letter-spacing: .06em; text-transform: uppercase; padding: .22em .45em; }
  .ov select { font: 700 2em/1.2 "Helvetica Neue", Helvetica, Arial, sans-serif; padding: .45em .5em; }
  .ov input:focus-visible, .ov select:focus-visible, .ov button:focus-visible { outline: .25em solid #ffd86b; outline-offset: .15em; }
  .ov .fine { margin: 0 0 .8em; font-size: 1.4em; opacity: .75; }
  .ov .err { min-height: 1.4em; margin: 0 0 .8em; font-size: 1.6em; font-weight: 700; color: #ff8cc0; }
  .ov .btns { display: flex; gap: 1.2em; align-items: center; margin-top: auto; }
  .pill {
    font: 2.6em Anton, Impact, sans-serif; letter-spacing: .03em; color: var(--cream); cursor: pointer;
    background: linear-gradient(180deg, #d93a85, #C0206A); border: 0; border-radius: 1.6em; padding: .2em 1.3em;
    box-shadow: 0 .2em 0 #7c1442;
  }
  .pill:active { transform: translateY(.15em); box-shadow: 0 .05em 0 #7c1442; }
  .pill:disabled { opacity: .55; cursor: default; }
  .ghost { font: 700 1.8em "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--cream); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: .4em .6em; }
  #boardList { flex: 1; min-height: 0; margin: .4em 0 1em; padding: 0; list-style: none; overflow-y: auto; font-size: 1.75em; }
  #boardList li { display: grid; grid-template-columns: 2.2em 3.4em 1fr 4.2em 2.2em; gap: .5em; align-items: baseline; padding: .32em .5em; border-bottom: .06em solid rgba(255,252,248,.16); }
  #boardList li.first { color: #ffd86b; font-weight: 700; }
  #boardList li.mine { background: rgba(255,252,248,.16); box-shadow: inset .3em 0 0 #ff8cc0; }
  #boardList .rk { opacity: .75; text-align: right; }
  #boardList .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform: uppercase; font-weight: 700; }
  #boardList .sc { text-align: right; font-variant-numeric: tabular-nums; }
  #boardList .lv { opacity: .7; font-size: .85em; }
  .ov .empty { margin: 0 0 1em; font-size: 1.8em; }
  .joywrap { display: flex; flex-direction: column; align-items: center; gap: .6em; }
  .help { position: relative; }
  .helpbtn {
    width: 2.2em; height: 2.2em; border-radius: 50%; padding: 0; cursor: help;
    font: 700 1.6em/1 "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--cream);
    background: #1f3a21; border: .1em solid rgba(255,252,248,.7);
    display: grid; place-items: center; box-shadow: 0 .18em 0 #060b06;
  }
  .helpbtn:focus-visible { outline: .25em solid #fff; outline-offset: .3em; }
  .tip {
    position: absolute; left: -5em; bottom: calc(100% + 1.2em); width: 33em; z-index: 20;
    background: var(--cream); color: var(--green); border-radius: 1.6em; padding: 1.8em 2em .8em;
    box-shadow: 0 1em 3em rgba(0,0,0,.55);
    opacity: 0; visibility: hidden; transform: translateY(.6em); pointer-events: none;
    transition: opacity .15s, transform .15s, visibility .15s;
  }
  .tip::after { content: ""; position: absolute; left: 5.4em; top: 100%; border: .9em solid transparent; border-top-color: var(--cream); }
  .help:hover .tip, .help:focus-within .tip, .help.open .tip { opacity: 1; visibility: visible; transform: none; }
  .tiprow { display: flex; align-items: center; gap: 1.6em; margin-bottom: 1.4em; }
  .tiprow p { margin: 0; font-size: 1.5em; line-height: 1.25; }
  .tiprow p b { font-size: 1.1em; }

    txt("LET'S", 28, 182, F(66), INK);
    txt('PLAY A', 28, 240, F(66), INK);
    txt('GAME.', 28, 298, F(66), INK);
    var bob = Math.sin(t * 4) * 5;
    ctx.strokeStyle = MAGENTA; ctx.lineWidth = 6; ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
    ctx.beginPath(); ctx.moveTo(246 + bob, 246); ctx.lineTo(322 + bob, 246); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(304 + bob, 224); ctx.lineTo(326 + bob, 246); ctx.lineTo(304 + bob, 268); ctx.stroke();
    txt('Congress wants hemp THC gone.', 28, 360, Hf(13), INK);
    txt('Get your Mood product to the exit. 3 lives.', 28, 379, Hf(13), INK);
    txt('Space jumps forward. Arrows move.', 28, 398, Hf(13), INK);
    txt('Faster crossings score more.', 28, 417, Hf(13), INK);
    if (blink(2)) txt('PRESS START', 180, 450, F(24), MAGENTA, 'center');
  }

  function drawChoose() {
    txt('PICK YOUR', 28, 92, F(44), INK);
    txt('PRODUCT.', 28, 138, F(44), INK);
    var xs = [70, 180, 290];
    for (var i = 0; i < 3; i++) {
      var on = i === sel, bob = on ? Math.sin(t * 6) * 3 : 0;
      if (on) { ctx.strokeStyle = MAGENTA; ctx.lineWidth = 3; rr(xs[i] - 48, 196, 96, 122, 10); ctx.stroke(); }
      product(i, xs[i], 250 + bob, 2.2, on ? 1 : 0.45);
      txt(NAMES[i], xs[i], 346, F(20), on ? INK : 'rgba(22,51,23,.4)', 'center');
    }
    txt('Left or right to choose.', 180, 396, Hf(13), INK, 'center');
    txt('Tap your pick or press space.', 180, 414, Hf(13), INK, 'center');
    if (blink(2)) txt('PRESS START', 180, 456, F(24), MAGENTA, 'center');
  }

  function drawGame() {
    var r;
    for (r = 1; r <= 9; r++) {
      if (r === 5) { ctx.fillStyle = '#DCE9D2'; ctx.fillRect(0, Y0 + r * C, W, C); }
      else if (r % 2 === 0) { ctx.fillStyle = 'rgba(22,51,23,.06)'; ctx.fillRect(0, Y0 + r * C, W, C); }
    }
    ctx.fillStyle = '#DCE9D2'; ctx.fillRect(0, Y0 + 10 * C, W, C);
    txt('RECESS', 180, Y0 + 5 * C + 27, F(16), 'rgba(22,51,23,.45)', 'center');
    if (level === 0 && t - levelStart < 7 && state === 'play') {
      txt('SPACE JUMPS, ARROWS MOVE', 180, Y0 + 10 * C + 27, F(16), 'rgba(22,51,23,.6)', 'center');
    }

    // goal row
    ctx.fillStyle = TEAL; ctx.fillRect(0, Y0, W, C);
    ctx.fillStyle = INK; ctx.fillRect(0, Y0 + C - 3, W, 3);
    txt('REGULATION', 180, Y0 + 29, F(24), INK, 'center');
    var up = blink(3) ? 0 : 3;
    [58, 302].forEach(function (ax) {
      ctx.fillStyle = INK; ctx.beginPath();
      ctx.moveTo(ax, Y0 + 9 - up); ctx.lineTo(ax + 11, Y0 + 27 - up); ctx.lineTo(ax - 11, Y0 + 27 - up); ctx.closePath(); ctx.fill();
    });

    for (var i = 0; i < lanes.length; i++) {
      var l = lanes[i];
      for (var k = 0; k < l.n; k++) {
        var x = lanePos(l, k);
        if (x > COLS || x + l.w < 0) continue;
        obstacle(l, x);
      }
    }

    if (state !== 'hit') {
      var lift = player.hop > 0 ? Math.sin((1 - player.hop / 0.18) * Math.PI) * 9 : 0;
      var px = player.x * C + 20, py = Y0 + player.y * C + 21 + Math.sin(t * 8) * 1.2 - lift;
      ctx.fillStyle = 'rgba(22,51,23,.25)'; ctx.beginPath(); ctx.ellipse(px, Y0 + player.y * C + 35, 11 - lift * 0.3, 3.5, 0, 0, 6.2832); ctx.fill();
      product(sel, px, py, 0.95, 1);
    }

    for (var j = 0; j < parts.length; j++) {
      var p = parts[j]; ctx.fillStyle = p.c; ctx.globalAlpha = clamp(p.life * 1.5, 0, 1);
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // HUD
    ctx.fillStyle = BG; ctx.fillRect(0, 0, W, Y0);
    ctx.fillStyle = INK; ctx.fillRect(0, Y0 - 3, W, 3);
    for (var h = 0; h < 3; h++) product(sel, 36 + h * 24, 22, 0.55, h < lives ? 1 : 0.18);
    var cur = cfg(level);
    fitTxt('LEVEL ' + (level + 1) + ': ' + cur.name, 190, 27, 16, INK, 'center', 150);
    txt(pad(score), 326, 21, F(18), INK, 'right');
    txt('BONUS ' + curBonus(), 326, 34, Hf(9), 'rgba(22,51,23,.75)', 'right');

    if (state === 'play' && t - levelStart < 1.8) {
      ctx.fillStyle = INK; ctx.fillRect(0, Y0 + 5 * C - 2, W, C + 4);
      fitTxt('LEVEL ' + (level + 1) + ': ' + cur.name, 180, Y0 + 5 * C + 29, 26, CREAM, 'center', 330);
    }

    if (state === 'clear' && lastClear) {
      ctx.fillStyle = 'rgba(22,51,23,.94)'; ctx.fillRect(0, 140, W, 230);
      txt('LEVEL CLEAR.', 180, 215, F(52), CREAM, 'center');
      txt('Time ' + lastClear.time.toFixed(1) + 's, time bonus +' + lastClear.bonus, 180, 247, Hf(14), CREAM, 'center');
      txt('Level multiplier x' + lastClear.mult, 180, 269, Hf(14), CREAM, 'center');
      txt('+' + lastClear.pts, 180, 316, F(38), PINK2, 'center');
      txt((lastClear.life ? 'Extra life! ' : '') + 'Next up: ' + cfg(level + 1).name, 180, 345, Hf(13), CREAM, 'center');
    }
    if (state === 'over') {
      ctx.fillStyle = 'rgba(22,51,23,.95)'; ctx.fillRect(0, 0, W, H);
      txt('CAUGHT.', 28, 190, F(84), CREAM);
      txt('Congress got your product.', 28, 226, Hf(15), CREAM);
      txt('Reached level ' + (level + 1), 28, 276, F(26), CREAM);
      txt('Score ' + pad(score), 28, 318, F(34), PINK2);
      txt('Best ' + pad(best), 28, 350, F(22), CREAM);
      if (rankNote) txt(rankNote, 28, 384, Hf(13), PINK2);
      if (blink(2)) txt('PRESS START', 28, 426, F(26), CREAM);
    }
  }

  function draw() {
    ctx.setTransform(2, 0, 0, 2, 0, 0);
    ctx.globalAlpha = 1;
    ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 18, (Math.random() - 0.5) * shake * 18);
    if (state === 'title') drawTitle();
    else if (state === 'choose') drawChoose();
    else drawGame();
    ctx.restore();
  }

  /* ---------- loop ---------- */
  var btnLabel = 'START', ledLast = 'INSERT COIN';
  function update(dt) {
    t += dt;
    shake = Math.max(0, shake - dt);
    player.hop = Math.max(0, player.hop - dt);
    var k = Math.min(1, dt * 22);
    player.x += (player.c - player.x) * k; player.y += (player.r - player.y) * k;
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 220 * dt; p.life -= dt;
      if (p.life <= 0) parts.splice(i, 1);
    }
    if (jdir) { jtimer -= dt; if (jtimer <= 0) { dirInput(jdir); jtimer = 0.2; } }

    var want = (state === 'play' || state === 'hit' || state === 'clear') ? 'JUMP' : 'START';
    if (want !== btnLabel) { btnLabel = want; startBtn.textContent = want; startBtn.classList.toggle('idle', want === 'START'); }
    var ledNow = (state === 'title' || state === 'choose') ? 'INSERT COIN' : (state === 'over' ? 'GAME OVER' : 'LEVEL ' + String(level + 1).padStart(2, '0'));
    if (ledNow !== ledLast) { ledLast = ledNow; ledEl.textContent = ledNow; ledEl.classList.toggle('blink', state === 'title' || state === 'choose' || state === 'over'); }

    if (state === 'play') {
      levelClock += dt;
      for (var a = 0; a < lanes.length; a++) {
        var l = lanes[a];
        if (l.row !== player.r) continue;
        for (var b = 0; b < l.n; b++) {
          var x = lanePos(l, b);
          if (x + 0.1 < player.c + 0.85 && x + l.w - 0.1 > player.c + 0.15) { die(); return; }
        }
      }
    } else if (state === 'hit') {
      stateTimer -= dt;
      if (stateTimer <= 0) {
        lives--;
        if (lives <= 0) { state = 'over'; saveBest(); jingle([330, 262, 196, 131]); onGameOver(); }
        else { resetPlayer(); state = 'play'; }
      }
    } else if (state === 'clear') {
      stateTimer -= dt;
      if (stateTimer <= 0) {
        level++; newLevel();
      }
    }
  }

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); updateBg(dt); draw();
    requestAnimationFrame(frame);
  }
  buildLanes();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
