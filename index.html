:root{
  --wrap:1200px;--gut:clamp(16px,4vw,40px);
  --green:#0E3A22;--orange:#E8550F;--yellow:#F5A70A;--cream:#FBF1E6;
  --h1:#0F3B22;--h1-accent:#E8550F;--text:#2A1712;
  --heat:.6;
  --display:"Cooper","Cooper Black","Georgia",serif;
  --sans:"Centra No2","Helvetica Neue",Arial,system-ui,sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:light}}
:root[data-theme="dark"]{color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:#1c0d07;color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.room{--h1:#FBEBD6;--h1-accent:#FF8A3D;--text:#F6E3CF}
img{max-width:100%}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:64px;background:var(--green)}
.nav-in{height:100%;max-width:calc(var(--wrap) + var(--gut)*2);margin:0 auto;padding:0 var(--gut);display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;color:#F3E7D3}.logo svg{height:24px;width:auto;display:block}
.promo{color:var(--yellow);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;text-align:center}
.nav-cta{display:inline-flex;align-items:center;background:var(--yellow);color:var(--green);border:0;border-radius:999px;padding:11px 20px;font:700 13px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;white-space:nowrap}

.hero{position:relative;height:calc(100vh - 64px);height:calc(100svh - 64px);min-height:620px;overflow:hidden;isolation:isolate;background:#2a140b}
.ext{position:absolute;inset:-60px;width:calc(100% + 120px);height:calc(100% + 120px);max-width:none;object-fit:cover;object-position:0% 50%;filter:blur(40px) brightness(.85)}
body.plain .ext{display:none}
body.plain .hero{background:linear-gradient(180deg,#FDECDA 0%,#FAE7D5 30%,#F7E2D0 56%,#F1D6C1 80%,#F7DAC4 100%)}

.plate{position:absolute;left:0;top:0;transform-origin:0 0}
.plate > img.bg{position:absolute;inset:0;width:100%;height:100%;display:block;max-width:none;user-select:none;-webkit-user-drag:none}
.fx{position:absolute;pointer-events:none}
.fx-dim{inset:0;background:#2a0c04;mix-blend-mode:multiply;opacity:calc((1 - var(--heat))*.28)}
.fx-halo{border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,120,40,.85),rgba(255,120,40,0) 62%);mix-blend-mode:screen;opacity:calc(var(--heat)*.55)}
.fx-pack{background:radial-gradient(ellipse at 100% 55%,rgba(255,130,50,.9),rgba(255,130,50,0) 70%);mix-blend-mode:screen;opacity:calc(var(--heat)*.55)}
.fx-table{border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,160,70,.9),rgba(255,160,70,0) 65%);mix-blend-mode:screen;opacity:calc(var(--heat)*.6)}
.glass{position:absolute;cursor:grab;touch-action:none}
.glass canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.gummy{position:absolute;left:0;top:0;will-change:transform;pointer-events:none;opacity:.95;filter:brightness(.8) saturate(2) hue-rotate(-12deg) contrast(1.08) drop-shadow(0 0 5px rgba(255,140,60,.45)) drop-shadow(1px 3px 3px rgba(60,0,4,.45))}

.veil{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,rgba(26,10,4,.82) 0%,rgba(26,10,4,.6) 34%,rgba(26,10,4,0) 60%)}
body.plain .veil{background:linear-gradient(90deg,rgba(251,240,228,.5) 0%,rgba(251,240,228,0) 45%)}

.copy{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;justify-content:center;gap:26px;max-width:calc(min(640px,52vw) + max(var(--gut),(100vw - var(--wrap))/2));padding:40px 0 40px max(var(--gut),calc((100% - var(--wrap))/2))}
.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#F3E7D3;border-radius:999px;padding:9px 16px;font-weight:700;font-size:12.5px;line-height:1;letter-spacing:.06em;text-transform:uppercase}
.pill svg{width:14px;height:14px}
h1{margin:0;font-family:var(--display);font-weight:800;color:var(--h1);font-size:clamp(52px,6.4vw,104px);line-height:.98;white-space:nowrap;letter-spacing:-.015em;text-shadow:0 2px 30px rgba(0,0,0,.08)}
body.room h1{text-shadow:0 2px 24px rgba(20,6,2,.45)}
h1 em{color:var(--h1-accent);font-style:italic;font-weight:900}
.sub{margin:0;max-width:30ch;font-size:clamp(17px,1.5vw,21px);line-height:1.45;color:var(--text);font-weight:500}
.ctas{display:flex;flex-wrap:wrap;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;border-radius:999px;padding:17px 30px;font:700 17px/1 var(--sans);cursor:pointer;border:2px solid transparent;transition:transform .15s ease}
.btn:hover{transform:translateY(-2px)}
.btn-primary{background:var(--orange);color:#FFF4EA;box-shadow:0 4px 0 #8E2F06}
.btn-ghost{background:#F7EEDD;color:var(--green);border-color:var(--green)}

.hint{position:absolute;right:max(var(--gut),calc((100% - var(--wrap))/2));top:24px;z-index:4;background:rgba(42,23,18,.82);color:#FFF4EA;font:500 12px var(--sans);padding:8px 12px;border-radius:8px;transition:opacity .6s}
.hint.gone{opacity:0}
.switch{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;background:rgba(14,58,34,.92);border-radius:999px;padding:4px;gap:2px;font:500 12px var(--sans)}
.switch button{border:0;background:transparent;color:#F3E7D3;padding:9px 14px;line-height:1;border-radius:999px;cursor:pointer;font:inherit}
.switch button[aria-pressed="true"]{background:var(--yellow);color:var(--green)}

@media (max-width:900px){
  .promo{display:none}
  .nav{height:56px}
  .hero{min-height:0;height:auto;background:linear-gradient(180deg,#1f0e07,#2a140b)}
  body.plain .hero{background:linear-gradient(180deg,#FDECDA,#F7E2D0)}
  .ext,.veil{display:none}
  .copy{height:auto;max-width:none;justify-content:flex-start;align-items:stretch;padding:28px 16px 0;gap:16px}
  .pill{font-size:11px;padding:8px 12px}
  h1{font-size:clamp(46px,15vw,76px);line-height:1}
  .sub{font-size:16px;max-width:none}
  .ctas{flex-direction:column;gap:10px;margin-top:4px}
  .btn{width:100%;padding:17px 22px;font-size:16px}
  .plate{-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14%)!important;mask-image:linear-gradient(180deg,transparent 0,#000 10%)!important}
  .hint{top:auto;bottom:16px;right:16px}
  .switch{bottom:calc(10px + env(safe-area-inset-bottom,0px));left:10px}
}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

const root=document.documentElement,body=document.body;
const hero=document.getElementById('hero'),plate=document.getElementById('plate'),bgimg=document.getElementById('bgimg');
const glass=document.getElementById('glass'),canvas=document.getElementById('gl');
const fxHalo=document.getElementById('fxHalo'),fxPack=document.getElementById('fxPack'),fxTable=document.getElementById('fxTable');
let scene='room',C=CFG.room,A=C.glass[2]*C.W/(C.glass[3]*C.H);

// ---------- layout: cover the hero, keep lamp on the right ----------
function layout(){
  const W=hero.clientWidth,IW=C.W,IH=C.H,g=C.glass,pk=C.pack;
  const mobile=window.innerWidth<=900;
  let s,ox,oy,H;
  if(mobile){
    const copy=document.querySelector('.copy');
    const top=copy.offsetTop+copy.offsetHeight+4;
    const rx0=Math.max(0,pk[0]-.06),rx1=Math.min(1,g[0]+g[2]*1.45);
    const ry0=Math.max(0,g[1]-g[3]*.42),ry1=Math.min(1,Math.max(pk[1]+pk[3],g[1]+g[3]*1.6)+.04);
    s=W/((rx1-rx0)*IW);
    const sh=(ry1-ry0)*IH*s;
    ox=-rx0*IW*s;oy=top-ry0*IH*s;H=top+sh;
    hero.style.height=H+'px';
    plate.style.webkitMaskImage=plate.style.maskImage='';
  }else{
    hero.style.height='';H=hero.clientHeight;
    s=Math.max(H/IH,W*.5/IW);
    const pw=IW*s;
    const right=W-Math.max(parseFloat(getComputedStyle(root).getPropertyValue('--gut'))||40,(W-1200)/2);
    const gwpx=g[2]*pw,target=right-gwpx*.85;
    ox=target-(g[0]+g[2]/2)*pw;
    ox=Math.min(ox,W*.25);
    oy=0;
    const gap=W-(ox+pw),l=Math.max(0,-ox);
    const fadeL=Math.min(35,30);const rEnd=gap>0?Math.max(80,100-(220/pw)*100):100;
    const m=`linear-gradient(90deg,transparent 0,#000 ${fadeL}%,#000 ${rEnd}%,${gap>0?'transparent':'#000'} 100%)`;
    plate.style.webkitMaskImage=plate.style.maskImage=m;
  }
  const pw=IW*s,ph=IH*s;
  plate.style.width=pw+'px';plate.style.height=ph+'px';plate.style.left=ox+'px';plate.style.top=oy+'px';
  Object.assign(glass.style,{left:g[0]*100+'%',top:g[1]*100+'%',width:g[2]*100+'%',height:g[3]*100+'%',clipPath:`polygon(${C.poly})`,webkitClipPath:`polygon(${C.poly})`});
  Object.assign(fxHalo.style,{left:(g[0]-g[2]*1.4)*100+'%',top:(g[1]-g[3]*.1)*100+'%',width:g[2]*3.8*100+'%',height:g[3]*1.3*100+'%'});
  Object.assign(fxTable.style,{left:(g[0]-g[2]*1.2)*100+'%',top:(g[1]+g[3]*1.18)*100+'%',width:g[2]*3.4*100+'%',height:g[3]*.35*100+'%'});
  Object.assign(fxPack.style,{left:pk[0]*100+'%',top:pk[1]*100+'%',width:pk[2]*100+'%',height:pk[3]*100+'%'});
  resizeGL();
}
window.addEventListener('resize',layout);
function setScene(v){
  scene=v;C=CFG[v];A=C.glass[2]*C.W/(C.glass[3]*C.H);
  body.classList.toggle('plain',v==='plain');body.classList.toggle('room',v==='room');
  bgimg.src=IMG[v];document.getElementById('ext').src=IMG[v];
  btns.forEach(b=>b.setAttribute('aria-pressed',b.dataset.bg===v));
  try{localStorage.setItem('mood-bg',v)}catch(e){}
  loadTex(v);layout();resetSim();
}
const btns=[...document.querySelectorAll('.switch button')];
btns.forEach(b=>b.onclick=()=>setScene(b.dataset.bg));
new ResizeObserver(layout).observe(hero);

// ---------- glass profile (physics bounds) ----------
function bounds(y){ // y 0 bottom .. 1 top -> [xl,xr] in liquid units
  const P=C.prof;y=Math.min(1,Math.max(0,y));
  for(let i=1;i<P.length;i++){const a=P[i-1],b=P[i];if((y<=a[0]&&y>=b[0])){const k=(a[0]-y)/((a[0]-b[0])||1);return [(a[1]+(b[1]-a[1])*k)*A,(a[2]+(b[2]-a[2])*k)*A]}}
  return [P[0][1]*A,P[0][2]*A];
}

// ---------- sim ----------
const N=6,GN=5,rnd=(a,b)=>a+Math.random()*(b-a);
let blobs=[],gummies=[];
for(let i=0;i<GN;i++){const el=document.createElement('img');el.className='gummy';el.alt='';el.src=GUMMY;glass.appendChild(el);gummies.push({el})}
function resetSim(){
  blobs=[];for(let i=0;i<N;i++){const y=rnd(.15,.85),[l,r]=bounds(y);blobs.push({x:rnd(l+.05,r-.05),y,vx:0,vy:0,r:rnd(.05,.08),temp:Math.random(),ph:Math.random()*6.28})}
  gummies.forEach((g,i)=>{const y=rnd(.15,.85),[l,r]=bounds(y);Object.assign(g,{x:rnd(l+.05,r-.05),y,vx:0,vy:0,rot:rnd(-40,40),vr:0,ph:Math.random()*6.28,s:rnd(.85,1.15)})});
}

// ---------- pointer ----------
const mouse={x:0,y:0,vx:0,vy:0,active:0,lx:null,ly:null,lt:0};
const hint=document.getElementById('hint');let hinted=false;
if(matchMedia('(hover: none)').matches)hint.textContent='Tocá y arrastrá en la lámpara';
function onMove(e){
  const r=glass.getBoundingClientRect();if(!r.height)return;
  const px=(e.clientX-r.left)/r.height,py=1-(e.clientY-r.top)/r.height,now=performance.now();
  if(mouse.lx!==null){const dt=Math.max(8,now-mouse.lt)/1000;mouse.vx=mouse.vx*.5+((px-mouse.lx)/dt)*.5;mouse.vy=mouse.vy*.5+((py-mouse.ly)/dt)*.5}
  mouse.lx=px;mouse.ly=py;mouse.lt=now;mouse.x=px;mouse.y=py;
  const inside=px>-.12&&px<A+.12&&py>-.05&&py<1.05;mouse.active=inside?1:0;
  if(inside&&!hinted){hinted=true;setTimeout(()=>hint.classList.add('gone'),900)}
}
window.addEventListener('pointermove',onMove,{passive:true});
window.addEventListener('pointerdown',onMove,{passive:true});
document.addEventListener('pointerleave',()=>{mouse.active=0});

// ---------- WebGL ----------
const gl=canvas.getContext('webgl',{antialias:false,premultipliedAlpha:false});
let U={},tex=null;
if(gl){
const vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const fs=`precision highp float;
uniform vec2 res;uniform float t;uniform vec3 B[${N}];uniform vec3 M;uniform vec2 MV;uniform sampler2D T;uniform float heat;
float field(vec2 p){float s=0.;for(int i=0;i<${N};i++){vec2 d=p-B[i].xy;s+=B[i].z*B[i].z/(dot(d,d)+1e-5);}vec2 d=p-vec2(res.x/res.y*.5,-.03);d.y*=1.7;s+=.012/(dot(d,d)+1e-5);return s;}
float H(float f){return 1.-1./max(f,.001);}
void main(){
 vec2 uv=gl_FragCoord.xy/res;vec2 p=gl_FragCoord.xy/res.y;
 vec2 dm=p-M.xy;float fall=exp(-dot(dm,dm)/.01)*M.z;
 vec2 disp=MV*fall*.03+vec2(-dm.y,dm.x)*fall*length(MV)*.05;
 vec2 tuv=uv-disp*vec2(res.y/res.x,1.)*.6;
 tuv.x+=sin(uv.y*14.+t*.6)*.002;
 vec3 base=texture2D(T,clamp(tuv,.001,.999)).rgb;
 vec2 q=p-disp+vec2(sin(p.y*9.+t*.7)*.004,0.);
 float f=field(q);float e=.004;float h0=H(f);
 float fx=H(field(q+vec2(e,0.)))-h0,fy=H(field(q+vec2(0.,e)))-h0;
 vec3 n=normalize(vec3(-fx,-fy,e*3.));
 float edge=smoothstep(.96,1.04,f);
 float inner=smoothstep(0.,.7,h0);
 float lit=.9+.3*pow(1.-uv.y,2.);
 vec3 wax=min(mix(vec3(1.,.40,.18),vec3(1.,.62,.32),inner)*lit,vec3(1.));
 float l=dot(n,normalize(vec3(-.4,.5,.75)));
 wax*=.94+.1*l;
 wax+=vec3(1.,.85,.6)*pow(max(l,0.),20.)*.18;
 float cyl=1.-pow(abs(uv.x-.5)*2.,2.4)*.3;wax*=cyl;
 vec3 hl=max(base-vec3(.78,.32,.22),0.)*1.4;
 vec3 col=mix(base,wax+hl,edge*.94);
 col+=vec3(1.,.42,.12)*smoothstep(.3,1.,f)*(1.-edge)*.22;
 col*=.92+heat*.14;
 gl_FragColor=vec4(col,1.);
}`;
const sh=(ty,src)=>{const s=gl.createShader(ty);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.warn(gl.getShaderInfoLog(s));return s};
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
['res','t','B','M','MV','T','heat'].forEach(k=>U[k]=gl.getUniformLocation(pr,k));
tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([200,30,15,255]));
[gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(w=>gl.texParameteri(gl.TEXTURE_2D,w,gl.CLAMP_TO_EDGE));
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.uniform1i(U.T,0);
}
function loadTex(v){if(!gl)return;const im=new Image();im.onload=()=>{if(scene!==v)return;gl.bindTexture(gl.TEXTURE_2D,tex);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im)};im.src=TEX[v]}
function resizeGL(){const r=glass.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.max(2,Math.round(r.width*d));canvas.height=Math.max(2,Math.round(r.height*d));if(gl)gl.viewport(0,0,canvas.width,canvas.height)}

// ---------- loop ----------
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,speed=reduce?.35:1;
let last=performance.now(),T=0,heat=.6;const arr=new Float32Array(N*3);
function clampX(o,y,pad){const [l,r]=bounds(y);if(o.x<l+pad){o.x=l+pad;o.vx=Math.abs(o.vx)*.4}if(o.x>r-pad){o.x=r-pad;o.vx=-Math.abs(o.vx)*.4}}
function step(now){
  const dt=Math.min(.05,(now-last)/1000)*speed;last=now;T+=dt;
  mouse.vx*=.9;mouse.vy*=.9;const mv=Math.hypot(mouse.vx,mouse.vy);
  const cx=(bounds(.5)[0]+bounds(.5)[1])/2;
  for(const b of blobs){
    b.temp+=((1.15-b.y*1.4)-b.temp)*dt*.35;if(b.y<.12)b.temp+=dt*.5;
    b.vy+=(b.temp-.5)*.09*dt;b.vx+=Math.sin(T*.3+b.ph)*.006*dt+(cx-b.x)*.02*dt;
    if(mouse.active){const dx=b.x-mouse.x,dy=b.y-mouse.y,d=Math.hypot(dx,dy);if(d<.2){const k=1-d/.2;b.vx+=mouse.vx*k*.9*dt+dx/(d+.01)*k*mv*.15*dt;b.vy+=mouse.vy*k*.9*dt}}
    b.vx*=Math.pow(.2,dt);b.vy*=Math.pow(.35,dt);b.vy=Math.max(-.45,Math.min(.45,b.vy));
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y>.97-b.r*.5){b.y=.97-b.r*.5;b.vy*=-.2;b.temp-=.05}if(b.y<.02){b.y=.02;b.vy=Math.abs(b.vy)*.2}
    clampX(b,b.y,b.r*.75);
  }
  const r=glass.getBoundingClientRect(),W=r.width,Hh=r.height,gw=W*.2;
  for(const g of gummies){
    g.vy+=Math.sin(T*.35+g.ph)*.012*dt+(.5-g.y)*.004*dt;g.vx+=Math.cos(T*.27+g.ph)*.006*dt;
    for(const b of blobs){const dx=g.x-b.x,dy=g.y-b.y,d=Math.hypot(dx,dy);if(d<b.r+.03){g.vy+=b.vy*dt*2;g.vx+=dx/(d+.001)*.02*dt}}
    if(mouse.active){const dx=g.x-mouse.x,dy=g.y-mouse.y,d=Math.hypot(dx,dy);if(d<.18){const k=1-d/.18;g.vx+=mouse.vx*k*1.4*dt;g.vy+=mouse.vy*k*1.4*dt;g.vr+=mouse.vx*Math.sign(-dy||1)*k*40*dt}}
    g.vx*=Math.pow(.25,dt);g.vy*=Math.pow(.25,dt);g.vr*=Math.pow(.3,dt);
    g.x+=g.vx*dt;g.y+=g.vy*dt;g.rot+=g.vr*dt+Math.sin(T*.4+g.ph)*4*dt;
    if(g.y>.92){g.y=.92;g.vy=-Math.abs(g.vy)*.3}if(g.y<.1){g.y=.1;g.vy=Math.abs(g.vy)*.3}
    clampX(g,g.y,.06*g.s);
    const sz=gw*g.s;g.el.style.width=sz+'px';
    g.el.style.transform=`translate(${(g.x/A)*W-sz/2}px,${(1-g.y)*Hh-sz*.44}px) rotate(${g.rot.toFixed(1)}deg)`;
  }
  let h=0;for(const b of blobs){h+=b.r*(1.25-b.y*.7)*(1.2-(b.x/A)*.6)}
  h=h/(N*.06)-.35+Math.sin(T*1.7)*.02+mv*.08;
  heat+=(Math.max(.15,Math.min(1,h))-heat)*Math.min(1,dt*2);
  root.style.setProperty('--heat',heat.toFixed(3));
  if(gl){blobs.forEach((b,i)=>{arr[i*3]=b.x;arr[i*3+1]=b.y;arr[i*3+2]=b.r});
    gl.uniform2f(U.res,canvas.width,canvas.height);gl.uniform1f(U.t,T);gl.uniform3fv(U.B,arr);gl.uniform1f(U.heat,heat);
    gl.uniform3f(U.M,mouse.x,mouse.y,mouse.active?1:0);gl.uniform2f(U.MV,mouse.vx,mouse.vy);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}
  requestAnimationFrame(step);
}
let start=new URLSearchParams(location.search).get('bg');
if(!start){try{start=localStorage.getItem('mood-bg')}catch(e){}}
setScene(start==='plain'?'plain':'room');
requestAnimationFrame(step);
})();
</script>
</body>
